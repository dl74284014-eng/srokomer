name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --org com.srokomer --project-name srokomer --platforms android .
          rm -rf test
          bash tool/patch_android.sh

      - name: Fixed signing key (so updates install over the old version)
        run: |
          mkdir -p ~/.android
          cp tool/debug.keystore ~/.android/debug.keystore

      - name: Dependencies and icon
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk srokomer.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Срокомер 1.0.${{ github.run_number }}
          body: Скачайте srokomer.apk и установите поверх старой версии — данные сохранятся.
          files: srokomer.apk
          make_latest: true
