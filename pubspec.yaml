name: srokomer
description: "Срокомер — учёт сроков годности товаров в корейском супермаркете"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  mobile_scanner: ^6.0.2
  google_mlkit_text_recognition: ^0.14.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  http: ^1.2.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#16794C"
  adaptive_icon_foreground: "assets/icon_fg.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
